<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>
    <div class="container flex bg-black">
        <div class="left" id="sidebar">
            <button id="closeSidebarBtn" class="closeSidebarBtn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none"
                    stroke="#ffffff" stroke-width="2" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="home bg-grey rounded m-1 p-1">
                <div class="logo m-1"><img src="spotify.svg" alt="logo-icon"></div>
                <ul>
                    <li><img src="home.svg" alt="home-icon">Home</li>
                    <li><img src="search.svg" alt="home-icon">Search</li>
                </ul>
            </div>
            <div class="library bg-grey rounded m-1 p-1">
                <div class="heading">
                    <img class="invert" src="playlist.svg" alt="playlist-icon">
                    <h4>
                        Your Library
                    </h4>
                </div>
                <div class="songList">
                    <ul>
                        <li>

                        </li>
                    </ul>
                </div>
                <div class="footer rounded bg-grey">
                    <div><a href="https://www.spotify.com/in-en/legal/" class="bottom-link">Legal</a></div>
                    <div><a href="https://www.spotify.com/in-en/safetyandprivacy/" class="bottom-link">Safety & Privacy
                            Center</a></div>
                    <div><a href="https://www.spotify.com/in-en/legal/privacy-policy/" class="bottom-link">Privacy
                            Policy</a>
                    </div>
                    <div><a href="https://www.spotify.com/in-en/legal/cookies-policy/" class="bottom-link">Cookies</a>
                    </div>
                    <div><a href="https://www.spotify.com/in-en/legal/privacy-policy/#s3" class="bottom-link">About
                            Ads</a>
                    </div>
                    <div><a href="https://www.spotify.com/in-en/accessibility/" class="bottom-link">Accessibility</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="right bg-grey rounded p-1">
            <div class="header">
                <div class="nav">
                    <button id="hamburgerBtn" class="hamburgerBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none"
                            stroke="#ffffff" stroke-width="2" stroke-linecap="round">
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#ffffff"
                        fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18"></path>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#ffffff"
                        fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18"></path>
                    </svg>
                </div>
                <div class="button">
                    <button class="signupbtn">Signup</button>
                    <button class="loginbtn">Log in</button>

                </div>
            </div>
            <div class="spotifyPlaylist">
                <h1>India's Best</h1>
                <div class="cardContainer">

                </div>

                <div class="playbar">

                    <div class="songinfo">

                    </div>
                    <div class="songbuttons">
                        <img id="prevBtn" src="previous.svg" alt="">
                        <img id="playBtn" src="play.svg" alt="">
                        <img id="nextBtn" src="nextsong.svg" alt="">
                    </div>
                    <div class="songtime">

                    </div>

                    <div class="seekbar">
                        <div class="circle">

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js" defer></script>


</body>

</html>
